<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero Thoughts</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 30% 20%, #201a14 0%, #14110d 55%, #0d0b09 100%);
    color: #f3ede2; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .wrap { width: 100%; max-width: 460px; }
  .brand { text-align: center; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #a08d6e; margin-bottom: 22px; }
  .card {
    background: linear-gradient(160deg, #24201a 0%, #1a1611 100%);
    border: 1px solid #33291d; border-left-width: 5px;
    border-radius: 18px; padding: 34px 28px; box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    opacity: 0; transform: translateY(8px); transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .card.show { opacity: 1; transform: translateY(0); }
  .hero-name { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 14px; }
  .quote-text { font-size: 21px; line-height: 1.55; color: #f6f1e7; font-weight: 500; }
  .actions { display: flex; gap: 10px; margin-top: 26px; }
  button {
    font-family: inherit; font-size: 14px; font-weight: 700; border-radius: 12px; padding: 13px 18px;
    cursor: pointer; border: none; transition: transform 0.1s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-next { flex: 1; background: #e9c46a; color: #1a1611; }
  .btn-save { width: 52px; background: #2a251d; color: #e9c46a; border: 1px solid #3d3527; font-size: 18px; }
  .btn-save.saved { background: #e9c46a; color: #1a1611; }
  .tabs { display: flex; justify-content: center; gap: 20px; margin-top: 26px; }
  .tab { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #776a54; background: none; border: none; padding: 6px 4px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: #e9c46a; border-bottom-color: #e9c46a; }
  .saved-list { margin-top: 18px; display: none; }
  .saved-list.show { display: block; }
  .saved-item { background: #1c1812; border: 1px solid #2c2519; border-left-width: 4px; border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; }
  .saved-item .h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .saved-item .t { font-size: 14px; line-height: 1.5; color: #ece4d4; }
  .saved-empty { text-align: center; color: #6b5f4b; font-size: 14px; padding: 30px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Hero Thoughts</div>
  <div class="card" id="card">
    <div class="hero-name" id="hero-name"></div>
    <div class="quote-text" id="quote-text"></div>
    <div class="actions">
      <button class="btn-next" id="next-btn" onclick="nextQuote()">Another thought</button>
      <button class="btn-save" id="save-btn" onclick="toggleSave()" title="Save this one">♡</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" id="tab-today" onclick="showView('today')">Today</button>
    <button class="tab" id="tab-saved" onclick="showView('saved')">Saved</button>
  </div>
  <div class="saved-list" id="saved-list"></div>
</div>

<script>
const QUOTES = [
  { hero: "Spider-Man", color: "#dc2626", text: "You don't have to save the whole city today. Just get through the next five minutes. That counts too." },
  { hero: "Batman", color: "#3b5c8c", text: "Even Batman has somebody making sure he eats and sleeps behind all that gear. Nobody does this completely alone, not even the guy with the cape." },
  { hero: "Superman", color: "#2563eb", text: "I can lift a building over my head and still not know what to say to someone who's hurting. Some days showing up matters more than being able to fix it." },
  { hero: "Wonder Woman", color: "#c9a227", text: "I grew up on an island that trained me for battle. Nobody trained me for how hard it is to be gentle with myself. Still working on that one." },
  { hero: "Captain America", color: "#3b5998", text: "Getting back up is the whole job description. I don't have to do it alone, and neither do you." },
  { hero: "Iron Man", color: "#c0392b", text: "Smartest guy in the room, and still some days I couldn't get out of bed. That doesn't make the suit any less real." },
  { hero: "Black Panther", color: "#6c3483", text: "Wakanda hid behind its walls for centuries because it was easier than opening the door. Sometimes the bravest thing is just letting people in." },
  { hero: "Hulk", color: "#27ae60", text: "The angriest, hardest days pass. What's underneath them doesn't." },
  { hero: "Thor", color: "#5dade2", text: "I've lost a hammer, a home, a brother. Worthiness was never about having it all together." },
  { hero: "Black Widow", color: "#922b21", text: "I don't erase my hardest chapters by being perfect. I do it by showing up anyway." },
  { hero: "Captain Marvel", color: "#b03a2e", text: "Faster and higher doesn't have to mean today. Today, just forward is enough." },
  { hero: "Doctor Strange", color: "#a04000", text: "I saw fourteen million futures. In most of them, you get through this one." },
  { hero: "Ant-Man", color: "#cb4335", text: "Even the smallest version of me can still get through the cracks. Small steps still move." },
  { hero: "Scarlet Witch", color: "#b03060", text: "I rewrote reality once trying to get back what I'd lost. Grief will make you try anything. What actually helped was a lot smaller and slower than magic." },
  { hero: "Hawkeye", color: "#7d3c98", text: "I don't have superpowers. I have practice, and showing up, and trying again tomorrow. So do you." },
  { hero: "Star-Lord", color: "#2874a6", text: "We're all a little bit of a mess. That's basically the definition of a team worth having." },
  { hero: "Gamora", color: "#1e8449", text: "I wasn't born gentle with myself. I'm learning. You're allowed to still be learning too." },
  { hero: "Rocket", color: "#ca6f1e", text: "Somebody took me apart and rebuilt me into something I never agreed to be. Everything I've done since then, though — that part's actually mine." },
  { hero: "Groot", color: "#6e2c00", text: "Even a small seed, buried in the dark, is still becoming something." },
  { hero: "Falcon", color: "#cb4335", text: "I used to counsel soldiers on dealing with what they carried home. Took me a while to sit down and take my own advice." },
  { hero: "Winter Soldier", color: "#566573", text: "I spent years not choosing anything for myself. Choosing rest today is still a kind of freedom." },
  { hero: "Miles Morales", color: "#922b21", text: "Nobody tells you how, so you find out as you go. That's not failing. That's just what starting looks like." },
  { hero: "Ms. Marvel", color: "#2471a3", text: "I used to think I had to become someone else to be enough. Turns out the whole point was being exactly who I already am." },
  { hero: "Luke Cage", color: "#b7950b", text: "Bullets bounce off me. Turns out a lot of the things that actually hurt don't." },
  { hero: "Jessica Jones", color: "#6c3483", text: "Some days all I do is survive the day. That still counts as something on the list." },
  { hero: "Daredevil", color: "#922b21", text: "I navigate by what I can't see too. You don't need the whole picture to take the next step." },
  { hero: "Silver Surfer", color: "#85929e", text: "I've crossed galaxies of nothing at all. Even in the emptiest stretch, momentum still counts." },
  { hero: "Vision", color: "#5b2c6f", text: "Part of me is still learning what it means to feel things. It's allowed to be complicated." },
  { hero: "Wolverine", color: "#b7950b", text: "Healing isn't instant for me either. It's just that I don't stop showing up while it happens." },
  { hero: "Professor X", color: "#b9770e", text: "You don't have to earn a place at this table. You already have one." },
  { hero: "Storm", color: "#85c1e9", text: "Even I can't control every storm. Some days the only power I have left is to keep walking through it." },
  { hero: "Cyclops", color: "#a93226", text: "I see the world through a filter I didn't choose. Doesn't mean I don't still get to lead." },
  { hero: "Jean Grey", color: "#ca6f1e", text: "I contain more than I can always control. That doesn't make me dangerous. It makes me human, amplified." },
  { hero: "Nightcrawler", color: "#5b2c6f", text: "I look different than everyone around me, and I still found my place. So will you." },
  { hero: "Rogue", color: "#52632c", text: "I couldn't touch anyone for years without hurting them. I still found ways to love people. There's always a way." },
  { hero: "Kitty Pryde", color: "#2e86c1", text: "I walk through walls because I refused to believe they were the whole story. Find your wall. Walk through it." },
  { hero: "Colossus", color: "#7b7d7d", text: "Being made of steel doesn't mean nothing gets to me. It means I keep standing after it does." },
  { hero: "Iceman", color: "#3498db", text: "I spent a long time hiding who I was from people who loved me. Telling the truth got easier every single time I did it." },
  { hero: "Beast", color: "#2980b9", text: "I look like the monster in the story. Turns out I get to write the story." },
  { hero: "Flash", color: "#c0392b", text: "Sometimes life doesn't need speed. It needs you to slow down long enough to actually arrive." },
  { hero: "Green Lantern", color: "#229954", text: "The ring runs on willpower, not on having none left. Recharging isn't quitting." },
  { hero: "Green Arrow", color: "#196f3d", text: "I don't hit the target every time. I nock another arrow anyway." },
  { hero: "Aquaman", color: "#148f77", text: "I spent my whole life between two worlds, belonging fully to neither. Eventually I built a third place: my own." },
  { hero: "Cyborg", color: "#5499c7", text: "Half of me runs on code now. The human half still short-circuits on bad days, same as anybody's would." },
  { hero: "Supergirl", color: "#2e86c1", text: "I don't have to be as strong as my cousin. I just have to be as strong as today needs." },
  { hero: "Batgirl", color: "#b7950b", text: "I got knocked down in a way that changed everything. I still put the cape back on, in my own way, on my own time." },
  { hero: "Nightwing", color: "#21618c", text: "I stepped out of somebody else's shadow to become someone else's hero. You get to become someone new too." },
  { hero: "Shazam", color: "#c0392b", text: "Underneath the costume I'm still just a kid figuring it out. So are most people who look like they have it together." },
  { hero: "Deadpool", color: "#922b21", text: "I make jokes about the worst days because sometimes that's the only way through them. Laughing doesn't mean it doesn't hurt." },
  { hero: "X-23", color: "#d4ac0d", text: "I was built for one purpose and chose a different one anyway. You get to choose too." },
  { hero: "Spider-Gwen", color: "#af7ac5", text: "In another universe I lost everything. In this one, I get to try again. So do you, today." },
  { hero: "Elektra", color: "#a93226", text: "I actually died once. Coming back didn't erase what happened before it — it just meant I got another round at it." },
  { hero: "Moon Knight", color: "#d5d8dc", text: "I don't always know which version of me shows up. All of them are still trying. That's what matters." },
  { hero: "She-Hulk", color: "#58d68d", text: "People assume I turn green because I've lost control. Half the time it's the first honest thing I've let myself feel all day." },
  { hero: "Valkyrie", color: "#7b241c", text: "I outran my grief for a long time. Facing it head-on was harder, and it was the thing that actually worked." },
  { hero: "Okoye", color: "#6c3483", text: "Loyalty to yourself counts as much as loyalty to anyone else you protect." },
  { hero: "Shuri", color: "#8e44ad", text: "I lost people I loved and rebuilt myself in the wreckage. Grief and strength can live in the same person." },
  { hero: "Mantis", color: "#52be80", text: "I feel what everyone around me feels. Some days I have to remember to feel my own feelings too." },
  { hero: "Drax", color: "#839192", text: "Grief made me literal about almost everything, except this: love doesn't leave just because someone does." },
  { hero: "Magneto", color: "#8e44ad", text: "I turned every scar into armor for a long time. Somewhere in there I mixed up armor with actually healing." },
  { hero: "Emma Frost", color: "#aeb6bf", text: "Diamond skin doesn't crack under pressure. It also doesn't feel much of anything while it's not cracking. Still looking for the setting in between." },
  { hero: "Gambit", color: "#922b3e", text: "Every hand I've ever been dealt felt unlucky walking in. I still play it out before deciding that's true." },
  { hero: "Psylocke", color: "#9b59b6", text: "I've worn more than one face and more than one body. Whoever's underneath all of it still gets to decide who she is." },
  { hero: "Cable", color: "#7f8c8d", text: "I came back from a future that already happened to me once. Yours hasn't been written yet." },
  { hero: "Bishop", color: "#34495e", text: "History already told me how this story ends. I came back anyway to argue with it." },
  { hero: "Quicksilver", color: "#85929e", text: "Everyone else looks like they're standing still to me. From where I'm running, just keeping up with my own head is the actual event." },
  { hero: "Wasp", color: "#f4d03f", text: "People assume small means unimportant. Nobody's ever said that to me twice." },
  { hero: "Kate Bishop", color: "#722f37", text: "Nobody handed me a fortune or a serum. I just kept showing up with a bow, bad jokes, and a lot of stubbornness." },
  { hero: "Yelena Belova", color: "#7b241c", text: "I went sarcastic instead of sad for a long time. Eventually I figured out they were the same thing wearing different outfits." },
  { hero: "America Chavez", color: "#1b4f72", text: "I can punch a hole into any universe there is. Finding the one where I actually belonged took a lot longer than the punching." },
  { hero: "Riri Williams", color: "#cb4335", text: "I built the whole suit myself, alone, in a dorm room, because I didn't think I could ask anyone for help. Turns out that part still needed fixing too." },
  { hero: "Namor", color: "#17a589", text: "Two different worlds have called me a monster. Neither one of them got a vote." },
  { hero: "Nova", color: "#d68910", text: "One guy, holding a title that used to belong to an entire army. Some days that's terrifying. I put the helmet on anyway." },
  { hero: "Cloak", color: "#1c2833", text: "There's real darkness in me. Darkness and lost were never actually the same address." },
  { hero: "Dagger", color: "#f7dc6f", text: "Light doesn't erase somebody's worst day. It just gives them somewhere to stand while they get through it." },
  { hero: "Blade", color: "#1b2631", text: "I hunt the thing I'm half made of, every night, forever. You don't have to fully understand yourself to still fight on your own side." },
  { hero: "Adam Warlock", color: "#f1c40f", text: "I was grown in a cocoon and built to be perfect. Perfect turned out to be a lot less useful than just being real." },
  { hero: "Hercules", color: "#b9770e", text: "Even a demigod runs out of steam. Immortal was never the same thing as unbreakable." },
  { hero: "War Machine", color: "#566573", text: "I fly next to the guy everybody's watching. Somebody's got to hold the line where the cameras aren't pointed. That's still holding the line." },
  { hero: "Zatanna", color: "#7d3c98", text: "Say the words backward and the whole room changes. Half of healing is just finding the right order to say things in." },
  { hero: "Booster Gold", color: "#f39c12", text: "Everybody thinks I'm here for the cameras. Most days I'm just trying to matter to somebody, same as anyone." },
  { hero: "Blue Beetle", color: "#1abc9c", text: "The armor talks in my head and I still don't always know what I'm doing. I do it scared. That still counts as doing it." },
  { hero: "Static", color: "#f7ca18", text: "I got these powers by accident, in a bad night I didn't choose. Didn't get a say in the accident. Still get a say in what happens after." },
  { hero: "John Stewart", color: "#229954", text: "I've carried guilt heavy enough to crack a planet. I still put the ring back on every single morning." },
  { hero: "Wally West", color: "#c0392b", text: "I spent years sprinting to catch up to somebody else's shadow. My own pace was always going to be fine." },
  { hero: "Martian Manhunter", color: "#cb4335", text: "I'm the last of everyone I used to know. Every day since, I've picked staying over disappearing." },
  { hero: "Plastic Man", color: "#e74c3c", text: "I stretch myself into whatever shape a room needs and forget to ask what shape I actually need. Working on that part." },
  { hero: "Raven", color: "#4a235a", text: "I keep my feelings locked down tight so nothing breaks because of me. Locked down isn't the same as gone. Still learning the difference." },
  { hero: "Beast Boy", color: "#58d68d", text: "I make jokes so nobody clocks how much I actually lost. Somebody finally asked me straight out, once. That helped more than any of the jokes did." },
  { hero: "Huntress", color: "#78281f", text: "I don't play well with a team most days. Needing one anyway isn't the contradiction it looks like." },
  { hero: "Iron Fist", color: "#d4ac0d", text: "I trained for years to punch through a dragon's heart. What I actually needed to get through turned out to be a lot quieter than that." },
  { hero: "Black Bolt", color: "#17202a", text: "One word from me can level a city, so I don't speak at all. Silence protects people. It costs something too. Both are true at once." },
  { hero: "Spider-Man 2099", color: "#1f618d", text: "I engineered a version of the future I thought would be safer for everyone. Turns out you can't build your way out of grief." },
  { hero: "Squirrel Girl", color: "#935116", text: "I've beaten enemies nobody thought I had a chance against, mostly by refusing to take any of it too seriously. Lightness is a kind of strength too." },
  { hero: "Jubilee", color: "#f7dc6f", text: "People who were supposed to stay left more than once. I still choose to trust the next person. That's not naive. That takes something." },
  { hero: "Sunspot", color: "#e67e22", text: "My power runs on sunlight, so the dark days leave me running on less. I've learned to wait some of them out instead of fighting them." },
  { hero: "Magik", color: "#78281f", text: "I spent formative years somewhere that would break most people completely. I came back and chose to protect people who'll never understand where I was." },
  { hero: "Cannonball", color: "#d35400", text: "Nobody expected much out of where I came from. Low expectations were never actually the ceiling." }
];

const STORAGE_KEY = 'heroThoughts_deck_v1';
const SAVED_KEY = 'heroThoughts_saved_v1';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function loadSaved() {
  try {
    const raw = localStorage.getItem(SAVED_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}
function persistSaved(list) {
  try { localStorage.setItem(SAVED_KEY, JSON.stringify(list)); } catch(e) {}
}

function shuffledIndices() {
  const idx = QUOTES.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
}

let state = loadState();
if (!state || !Array.isArray(state.deck)) {
  state = { deck: shuffledIndices(), current: null };
}

function drawNext() {
  if (state.deck.length === 0) {
    let fresh = shuffledIndices();
    // avoid an immediate repeat of the last card shown at the start of a new cycle
    if (fresh[0] === state.current && fresh.length > 1) {
      const swapAt = 1 + Math.floor(Math.random() * (fresh.length - 1));
      [fresh[0], fresh[swapAt]] = [fresh[swapAt], fresh[0]];
    }
    state.deck = fresh;
  }
  state.current = state.deck.shift();
  saveState(state);
  return state.current;
}

let savedList = loadSaved();

function render(index) {
  const q = QUOTES[index];
  const card = document.getElementById('card');
  card.classList.remove('show');
  card.style.borderLeftColor = q.color;
  document.getElementById('hero-name').textContent = q.hero;
  document.getElementById('hero-name').style.color = q.color;
  document.getElementById('quote-text').textContent = q.text;
  updateSaveBtn(index);
  requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('show')));
}

function updateSaveBtn(index) {
  const btn = document.getElementById('save-btn');
  const isSaved = savedList.includes(index);
  btn.classList.toggle('saved', isSaved);
  btn.textContent = isSaved ? '♥' : '♡';
}

function nextQuote() {
  render(drawNext());
}

function toggleSave() {
  const index = state.current;
  if (savedList.includes(index)) {
    savedList = savedList.filter(i => i !== index);
  } else {
    savedList.push(index);
  }
  persistSaved(savedList);
  updateSaveBtn(index);
  if (document.getElementById('saved-list').classList.contains('show')) renderSavedList();
}

function renderSavedList() {
  const el = document.getElementById('saved-list');
  if (!savedList.length) {
    el.innerHTML = '<div class="saved-empty">Nothing saved yet. Tap the heart on a thought that lands to keep it here.</div>';
    return;
  }
  el.innerHTML = savedList.slice().reverse().map(i => {
    const q = QUOTES[i];
    return `<div class="saved-item" style="border-left-color:${q.color}">
      <div class="h" style="color:${q.color}">${q.hero}</div>
      <div class="t">${q.text}</div>
    </div>`;
  }).join('');
}

function showView(view) {
  document.getElementById('tab-today').classList.toggle('active', view === 'today');
  document.getElementById('tab-saved').classList.toggle('active', view === 'saved');
  document.getElementById('card').style.display = view === 'today' ? 'block' : 'none';
  document.querySelector('.actions').style.display = view === 'today' ? 'flex' : 'none';
  document.getElementById('saved-list').classList.toggle('show', view === 'saved');
  if (view === 'saved') renderSavedList();
}

// Show a fresh thought every time the page opens - a new moment each visit,
// while the shuffled deck still guarantees no repeats until everything's been seen.
render(drawNext());
</script>
</body>
</html>
